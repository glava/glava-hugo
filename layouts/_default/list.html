{{ define "main" }}
<div class="archive-list">
    {{ range .Pages.GroupByDate "2006" }}
    <div class="year-section">
        <h2>{{ .Key }}</h2>
        {{ range .Pages }}
        <article class="archive-preview">
            <h3><a href="{{ .Permalink }}">{{ .Title | upper }}</a></h3>
            <time>{{ .Date.Format "January 2, 2006" }}</time>
            {{ if .Params.hero_image }}
            <div class="preview-image">
                <a href="{{ .Permalink }}">
                    <img src="{{ .Params.hero_image }}" alt="{{ .Title }}" loading="lazy">
                </a>
            </div>
            {{ end }}
            {{ if .Summary }}
            <p>{{ .Summary }}</p>
            {{ end }}
        </article>
        {{ end }}
    </div>
    {{ end }}
</div>
{{ end }}
