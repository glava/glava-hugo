{{ define "main" }}
<div class="archive-list">
    <div class="posts-list">
        {{ range .Site.RegularPages }}
        <div class="post-item">
            <a href="{{ .Permalink }}">{{ .Date.Format "2006" }} / {{ .Title | upper }}</a>
        </div>
        {{ end }}
    </div>
</div>
{{ end }}
